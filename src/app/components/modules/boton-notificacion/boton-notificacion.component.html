<button type="button" class="btn position-relative text-white rounded-3 d-inline-flex align-items-center" (click)="showDialog = true" style="background-color: #73b7ad;">
  <span class="position-relative">
    <i class="pi pi-bell" style="font-size: 1.5rem;"></i>
    <span *ngIf="cntNotificaciones > 0" class="badge-notifications">{{cntNotificaciones}}</span>
  </span>
  <span class="ms-3">Notificaciones</span>
</button>

<p-dialog header="Notificaciones" [(visible)]="showDialog" [modal]="true" [style]="{width: '480px', height: '550px'}" [baseZIndex]="10000" [closable]="true" (onHide)="showDialog = false">
  <div *ngFor="let notificacion of notificaciones" class="notification-item text-left">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div class="col notification-text" [ngClass]="{'fw-bold': !notificacion.leida}">
        {{notificacion.textoNotificacion}}
      </div>
      <div class="col-auto d-flex gap-2 ms-2">
        <button class="btn rounded-3" style="background-color: lightgray;" title="Ver caso" (click)="verNotificacion(notificacion.url)"><i class="pi pi-eye"></i> Ver</button>
        <button class="btn rounded-3 text-danger" style="background-color: #f8d7da;" title="Eliminar notificación" (click)="eliminarNotificacion(notificacion.idNotificacion)"><i class="pi pi-trash"></i></button>
      </div>
    </div>
    <div class="notification-date text-muted">{{notificacion.fechaNotificacion | date:'dd/MM/yyyy' }}</div>
    <hr>
  </div>
</p-dialog>
