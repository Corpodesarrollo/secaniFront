<p class="fs-5 fw-medium text-center">¿Desea abandonar seguimiento?</p>
<div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
    <button pButton label="Sí, Guardar y Reagendar" class="p-button-secondary" (click)="onSave()"></button>
    <button pButton label="Sí, Salir sin guardar" class="p-button-warning" (click)="onExit()"></button>
    <button pButton label="No, Continuar Seguimiento" class="p-button-success" (click)="onCancel()"></button>
</div>
