<div class="fuente-letra pe-4">
    <div class="row mb-3  align-items-center">
        <div class="col-12 d-flex justify-content-between">
            <app-breadcrumb [id]="id" />
            <div>
                Estado: <app-estado-nna [nnaEstadoId]="diagnostico.idEstado" />
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <app-seguimiento-steps [stepsCount]="3" [activeIndex]="2" />
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <div class="row">
                <div class="col-12 col-md-6 mb-3 mb-md-0">
                    <p-card [style]="{ 'height': '100%' }">
                        <div class="row align-items-center mb-2 flex flex-wrap p-fluid">
                            <div class="col-12">
                                <label for="observaciones" class="fw-bold">¿Desea agregar algo más a la entrevista realizada? / Observaciones</label>
                                <textarea id="observaciones" pInputText rows="10" maxlength="5000" [(ngModel)]="diagnostico.observaciones" placeholder="Escriba aquí"></textarea>
                            </div>
                        </div>
                    </p-card>
                </div>
                <div class="col-12 col-md-6">
                    <p-card [style]="{ 'background-color': '#eef2f8', 'height': '100%' }">
                        <div class="row">
                            <div class="col-12">
                                <i class="pi pi-comment me-2 text-primary" style="font-size: 2rem"></i>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12 fs-5" style="text-align: justify;">
                                <p>
                                    Agradecemos la información suministrada, estaremos realizando una nueva llamada de seguimiento en los próximos <b>8/15</b> días.
                                </p>
                            </div>
                        </div>
                    </p-card>
                </div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-12 text-center">
                    <button class="btn text-white rounded-4 btn-lg" type="submit" style="background-color: #ff9801; width: 400px;" [appPermiso]="'canEdit'" path="gestion/seguimientos" mode="disable">GUARDAR</button>
                </div>
            </div>
        </div>
    </div>
</div>
